<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

</head>
<body class="map-body">
  <header class="site-header">
    <h1>♨ 御泉印WEB</h1>
    <nav>
      <a href="index.html">リスト</a>
      <a href="map.html" class="active">マップ</a>
      <a href="gallery.html">書影一覧</a>
    </nav>
  </header>

  <div class="map-toolbar">
    <label class="check"><input type="checkbox" id="only-on-sale"> 販売終了の事業者を隠す</label>
    <span class="legend"><span class="pin-dot on"></span>発売中・発売前あり</span>
    <span class="legend"><span class="pin-dot off"></span>すべて終了</span>
    <span class="legend"><span class="pin-dot approx"></span>位置はおおよそ</span>
    <span class="spacer"></span>
    <span id="map-status" class="count"></span>
    <span class="map-hint mobile-only">ピンを長押しで御泉印書影一覧表示</span>
  </div>
  <div id="map"></div>
  <p id="map-message" class="map-message" hidden></p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
